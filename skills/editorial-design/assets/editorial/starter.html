<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Editorial · Palette & Layout</title><link rel="stylesheet" href="style.css"><link rel="stylesheet" href="compound-components.css"><link rel="stylesheet" href="palette-lab.css"><body><header class="palette-head"><strong>EDITORIAL / CONFIGURATION</strong><span>PORTABLE COMPONENTS / v1</span></header><main><section class="palette-lead"><p class="eyebrow">STYLE, INTERACTION, CONFIGURATION</p><h1>同一种秩序，<br>多种色彩。</h1><p class="reading">颜色由完整角色配置，布局按任务选择。选中记录不会因为换主题或布局丢失。</p></section><section class="palette-tools" aria-label="配置预览"><label>色卡<select id="palette"></select></label><label>任务布局<select id="layout"><option value="compare">比较 / 双栏</option><option value="reading">阅读 / 连续正文</option><option value="dashboard">监控 / 主次模块</option><option value="operation">操作 / 任务侧栏</option></select></label><span id="color-check" role="status"></span></section><div id="swatches" aria-label="当前色卡角色"></div><section id="preview" data-layout="compare" aria-label="编辑式组合预览"><div><p class="eyebrow">01 / CONTEXT</p><h2>让对象保持清楚。</h2><p class="reading">这是一组原创接口样例。表格与列表使用稳定 ID，零、缺失和负值保留各自含义；改变配色仅改变语义变量。</p><div id="card"></div></div><div><p class="eyebrow">02 / RECORDS</p><div id="list"></div><div id="table"></div></div></section><details class="palette-config"><summary>自定义完整色卡 JSON</summary><label for="palette-json">12 个语义角色 · 六位十六进制颜色</label><textarea id="palette-json" spellcheck="false" rows="15"></textarea><button class="button primary" id="apply-palette" type="button">应用草稿</button><p id="palette-result" role="status" aria-live="polite">修改后应用。失败时保留最近有效配色和当前记录。</p></details><footer>原创设计样例 · 角色颜色检查不等于整页可访问性验收</footer></main><script type="module" src="palette-lab.mjs"></script></body></html>
