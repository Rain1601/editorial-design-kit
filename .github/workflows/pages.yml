name: Deploy examples to Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python scripts/check-portability.py
      - run: node --test tests/*.test.mjs examples/agent-task/tests/*.test.mjs
      - uses: actions/configure-pages@v5
      - name: Stage public static files
        run: |
          mkdir _site
          cp -R index.html examples skills docs _site/
          cp README.md README.zh-CN.md LICENSE LICENSE.md _site/
          touch _site/.nojekyll
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
